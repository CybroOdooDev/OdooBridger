# OdooBridger: the core plus the BioBridge (biometric) service.
#
#   cp deploy/.env.example deploy/.env      # then fill it in
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Local: the core on http://localhost:8000 (website, /app portal, /staff
# console), BioBridge on http://localhost:8001. In production add the Caddy
# override (docker-compose.prod.yml) for HTTPS on your three hostnames.

name: odoobridger

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: odoobridger
      POSTGRES_USER: odoobridger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoobridger -d odoobridger"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    <<: *restart
    build: {context: ../core}
    image: odoobridger-core:latest
    depends_on: {postgres: {condition: service_healthy}}
    ports: ["${CORE_PORT:-8000}:8000"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://odoobridger:${POSTGRES_PASSWORD}@postgres:5432/odoobridger
      PUBLIC_BASE_URL: ${CORE_PUBLIC_URL:-http://localhost:8000}
      SITE_URL: ${SITE_URL:-}
      JWT_SECRET: ${CORE_JWT_SECRET:?set CORE_JWT_SECRET}
      MASTER_ENCRYPTION_KEY: ${CORE_MASTER_KEY:?set CORE_MASTER_KEY}
      SIGNING_KEY_PEM: ${CORE_SIGNING_KEY_PEM:-}
      STAFF_EMAIL: ${STAFF_EMAIL:-}
      STAFF_PASSWORD: ${STAFF_PASSWORD:-}
      # The biometric service: registered at boot, secret shared with BioBridge.
      BIOMETRIC_CLIENT_SECRET: ${BIOMETRIC_CLIENT_SECRET:?set BIOMETRIC_CLIENT_SECRET}
      BIOMETRIC_BASE_URL: ${BIOMETRIC_PUBLIC_URL:-http://localhost:8001}
      BIOMETRIC_INTERNAL_URL: http://biobridge:8000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@odoobridger.com}
      SALES_EMAIL: ${SALES_EMAIL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

  biobridge:
    <<: *restart
    build: {context: ../services/biobridge, dockerfile: deploy/Dockerfile}
    image: odoobridger-biobridge:latest
    depends_on:
      postgres: {condition: service_healthy}
      core: {condition: service_healthy}
    ports: ["${BIOMETRIC_PORT:-8001}:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://odoobridger:${POSTGRES_PASSWORD}@postgres:5432/biobridge
      PUBLIC_BASE_URL: ${BIOMETRIC_PUBLIC_URL:-http://localhost:8001}
      JWT_SECRET: ${BIOBRIDGE_JWT_SECRET:?set BIOBRIDGE_JWT_SECRET}
      MASTER_ENCRYPTION_KEY: ${BIOBRIDGE_MASTER_KEY:?set BIOBRIDGE_MASTER_KEY}
      PLATFORM_MODE: "true"
      PLATFORM_CORE_URL: ${CORE_PUBLIC_URL:-http://localhost:8000}
      PLATFORM_CORE_INTERNAL_URL: http://core:8000
      PLATFORM_CLIENT_SECRET: ${BIOMETRIC_CLIENT_SECRET}
      # BioBridge's own staff console (scheduler, diagnostics) keeps its own login.
      STAFF_EMAIL: ${STAFF_EMAIL:-}
      STAFF_PASSWORD: ${STAFF_PASSWORD:-}
      ADMS_SERVER_HOST: ${ADMS_SERVER_HOST:-}
      ADMS_SERVER_PORT: ${ADMS_PORT:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}

volumes:
  pgdata:
